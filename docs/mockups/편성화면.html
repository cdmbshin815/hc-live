<title>런다운 편성 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">

<style>
:root{
  --bg:#0E1113; --panel:#14181B; --panel2:#191F23; --raised:#212A31;
  --line:#29333A; --line-soft:#1E262C;
  --text:#E6EBED; --dim:#93A1A8; --faint:#64737B;
  --accent:#4FB3C9; --accent-dim:#2B6B79; --accent-ghost:rgba(79,179,201,.13);
  --onair:#FF4438; --next:#FFA726; --ready:#5BC98C;
  --warn:#FFC24A; --error:#FF6B5A; --filler:#7C8FA6;
  --s-local:#8FA3B0; --s-folder:#C9A15A; --s-yt:#B85A52; --s-cf:#E0873A; --s-bunny:#9B7BC4;
  --r:5px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

.app{display:flex;flex-direction:column;height:100vh;min-height:600px}

/* ── topbar ─────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 16px;height:52px;
  flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.chan{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 9px;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r)}
.chan-dot{width:7px;height:7px;border-radius:50%;background:var(--onair);
  box-shadow:0 0 0 3px rgba(255,68,56,.16)}
.chan b{font-weight:500;font-size:12.5px}
.chan em{font-style:normal;color:var(--faint);font-size:11px}
.tally{margin-left:auto;display:flex;align-items:center;gap:14px}
.tally-pill{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:20px;
  background:rgba(255,68,56,.11);border:1px solid rgba(255,68,56,.32)}
.tally-pill i{width:6px;height:6px;border-radius:50%;background:var(--onair);animation:pulse 2s infinite}
.tally-pill span{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#FF8478}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.clock{font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.clock small{font-size:11px;color:var(--faint);margin-left:6px;font-weight:400}

/* ── ribbon ─────────────────────────────────────── */
.ribbon{flex:0 0 auto;padding:9px 16px 11px;background:var(--panel);border-bottom:1px solid var(--line)}
.ribbon-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.ribbon-head .hint{margin-left:auto;font-size:10.5px;color:var(--faint)}
#ribbon{display:block;width:100%;height:44px;cursor:pointer;border-radius:3px}

/* ── panes ──────────────────────────────────────── */
.panes{flex:1 1 auto;display:grid;grid-template-columns:236px minmax(0,1fr) 300px;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane + .pane{border-left:1px solid var(--line)}
.pane-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--line-soft);min-height:40px}
.pane-body{flex:1 1 auto;overflow:auto;min-height:0}

/* view switch */
.vsw{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:var(--r);
  border:1px solid var(--line)}
.vsw button{padding:4px 12px;border-radius:3px;font-size:11.5px;color:var(--dim)}
.vsw button[aria-pressed="true"]{background:var(--raised);color:var(--text);font-weight:600}

.btn{padding:4px 9px;border:1px solid var(--line);border-radius:var(--r);
  font-size:11.5px;color:var(--dim);background:var(--panel2)}
.btn:hover{border-color:var(--accent-dim);color:var(--text)}
.btn.primary{background:var(--accent-ghost);border-color:var(--accent-dim);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{margin-left:auto}
.meta{font-size:11px;color:var(--faint)}

/* ── library ────────────────────────────────────── */
.search{margin:9px 12px;padding:6px 9px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);color:var(--text);font:inherit;font-size:12px;width:calc(100% - 24px)}
.search::placeholder{color:var(--faint)}
.src-group{padding:2px 8px 8px}
.src-group h4{margin:9px 4px 5px;font-size:10px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.lib-item{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:var(--r);
  cursor:grab;user-select:none}
.lib-item:hover{background:var(--panel2)}
.lib-item.dragging{opacity:.35}
.lib-item .t{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item .d{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.pool-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r);
  cursor:grab;user-select:none;border:1px solid transparent}
.pool-item:hover{background:var(--panel2);border-color:var(--line)}
.pool-item .t{flex:1;min-width:0;font-size:12px}
.pool-item .c{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.swatch{width:9px;height:9px;border-radius:2px;flex:0 0 auto}

.dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.dot.local{background:var(--s-local)} .dot.folder{background:var(--s-folder)}
.dot.yt{background:var(--s-yt)} .dot.cf{background:var(--s-cf)} .dot.bunny{background:var(--s-bunny)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 5px;border-radius:3px;
  background:var(--raised);font-size:9.5px;font-weight:600;color:var(--dim);flex:0 0 auto}

/* ── 주간 편성 그리드 ───────────────────────────── */
.grid-wrap{padding:0 0 30px}
.grid-days{position:sticky;top:0;z-index:5;display:grid;
  grid-template-columns:46px repeat(7,minmax(0,1fr));
  background:var(--panel);border-bottom:1px solid var(--line)}
.grid-days div{padding:6px 0;text-align:center;font-size:11px;color:var(--dim)}
.grid-days div.today{color:var(--accent);font-weight:600}
.grid-days div.sun{color:#D98A82}
.grid{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));position:relative}
.hours{border-right:1px solid var(--line-soft)}
.hour{height:26px;font-family:var(--mono);font-size:10px;color:var(--faint);
  text-align:right;padding-right:6px;line-height:1;transform:translateY(-5px)}
.daycol{position:relative;border-right:1px solid var(--line-soft);cursor:crosshair}
.daycol.today{background:rgba(79,179,201,.035)}
.daycol .hline{position:absolute;left:0;right:0;height:1px;background:var(--line-soft)}
.daycol .hline.major{background:#242E34}

.blk{position:absolute;left:2px;right:2px;border-radius:4px;padding:4px 6px;overflow:hidden;
  cursor:pointer;border:1px solid;font-size:10.5px;line-height:1.3}
.blk b{display:block;font-weight:600;font-size:11px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.blk span{color:inherit;opacity:.72;font-family:var(--mono);font-size:9.5px}
.blk.sel{outline:2px solid var(--accent);outline-offset:-1px}
.blk.auto{border-style:dashed;background:repeating-linear-gradient(135deg,
  rgba(124,143,166,.13) 0 5px,transparent 5px 10px);border-color:rgba(124,143,166,.42);color:#9FB0BE}
.blk.ghost{opacity:.55;border-style:dashed}
.nowline{position:absolute;left:0;right:0;height:1.5px;background:var(--onair);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-3px;top:-2.5px;width:6px;height:6px;
  border-radius:50%;background:var(--onair)}

.cover{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--dim)}
.cover .bar{flex:1;height:5px;border-radius:3px;background:var(--raised);overflow:hidden;display:flex}
.cover .bar i{display:block;height:100%}
.cover .bar i.b{background:var(--accent-dim)}
.cover .bar i.a{background:repeating-linear-gradient(135deg,#4A5964 0 4px,#39454E 4px 8px)}

/* ── 런다운 ─────────────────────────────────────── */
.onair-bar{flex:0 0 auto;padding:9px 14px 10px;
  background:linear-gradient(180deg,rgba(255,68,56,.10),rgba(255,68,56,.03));
  border-bottom:1px solid rgba(255,68,56,.28)}
.onair-row{display:flex;align-items:baseline;gap:10px}
.onair-row .tag{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--onair)}
.onair-row .ttl{font-size:13.5px;font-weight:500;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onair-row .rem{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.onair-sub{display:flex;gap:10px;margin-top:3px;font-size:10.5px;color:var(--faint)}
.onair-track{margin-top:7px;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.onair-fill{height:100%;background:var(--onair);border-radius:2px;transition:width .9s linear}

.rows{padding:4px 0 40px}
.row{display:grid;grid-template-columns:3px 22px 74px minmax(0,1fr) auto 52px;
  align-items:center;gap:9px;padding:6px 12px 6px 0;border-bottom:1px solid var(--line-soft);
  cursor:grab;user-select:none;position:relative}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--accent-ghost)}
.row.past{opacity:.42}
.row.dragging{opacity:.3}
.row.locked{cursor:default}
.row.flash .time{animation:flash .55s ease-out}
@keyframes flash{0%{color:var(--accent);background:var(--accent-ghost)}100%{}}
.stripe{align-self:stretch;border-radius:0 2px 2px 0}
.row.s-onair .stripe{background:var(--onair)}
.row.s-next .stripe{background:var(--next)}
.row.s-ready .stripe{background:#39434A}
.row.s-filler .stripe{background:repeating-linear-gradient(180deg,var(--filler) 0 3px,transparent 3px 6px)}
.grip{display:flex;justify-content:center;color:#3D4850;font-size:12px;letter-spacing:-1px}
.row.locked .grip{color:#2C353B}
.time{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;
  border-radius:3px;padding:1px 2px}
.row.s-onair .time{color:var(--onair)}
.title{min-width:0;display:flex;align-items:center;gap:7px}
.title .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.marks{display:flex;align-items:center;gap:5px}
.mark{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:3px;
  font-size:9.5px;font-weight:600}
.mark.hard{background:rgba(255,68,56,.15);color:#FF8478}
.mark.soft{background:rgba(255,167,38,.15);color:#FFC078}
.mark.nb{background:rgba(79,179,201,.15);color:#7FD0E0}
.mark.blk{background:transparent;color:var(--faint);font-size:9.5px;padding:0}
.dur{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right;
  font-variant-numeric:tabular-nums}

.warn{display:flex;align-items:center;gap:9px;margin:3px 12px 3px 34px;padding:6px 9px;
  border-radius:var(--r);font-size:11.5px;
  background:rgba(255,194,74,.07);border:1px dashed rgba(255,194,74,.34);color:#FFD481}
.warn.cut{background:rgba(255,68,56,.07);border-color:rgba(255,68,56,.34);color:#FF9084}
.warn .msg{flex:1;min-width:0}
.warn .msg b{font-family:var(--mono);font-weight:500}
.warn button{padding:2px 8px;border-radius:3px;font-size:11px;border:1px solid currentColor;
  color:inherit;opacity:.85}
.warn button:hover{opacity:1;background:rgba(255,255,255,.06)}

.drop-line{position:fixed;height:2px;background:var(--accent);pointer-events:none;z-index:60;
  box-shadow:0 0 8px rgba(79,179,201,.7)}
.drop-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--accent)}
.drop-tip{position:fixed;z-index:61;padding:3px 8px;border-radius:4px;pointer-events:none;
  background:var(--accent);color:#06171B;font-family:var(--mono);font-size:11px;font-weight:600;
  transform:translate(0,-50%)}
.ghost{position:fixed;z-index:59;pointer-events:none;padding:6px 12px;border-radius:var(--r);
  background:var(--raised);border:1px solid var(--accent-dim);font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:.95;transform:translate(10px,-50%);
  max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── inspector ──────────────────────────────────── */
.insp{padding:12px 14px 30px;display:flex;flex-direction:column;gap:15px}
.insp .empty{color:var(--faint);font-size:12px;padding:24px 0;text-align:center;line-height:1.7}
.field{display:flex;flex-direction:column;gap:5px}
.field .v{font-size:13px}
.field .v.mono{font-size:12.5px;color:var(--dim)}
.seg{display:grid;gap:3px;background:var(--bg);padding:3px;border-radius:var(--r);
  border:1px solid var(--line)}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg button{padding:5px 2px;border-radius:3px;font-size:10.5px;color:var(--dim);text-align:center}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);font-weight:600}
.seg button[aria-pressed="true"][data-t="hard"]{color:#FF8478}
.seg button[aria-pressed="true"][data-t="soft"]{color:#FFC078}
.seg button[aria-pressed="true"][data-t="notBefore"]{color:#7FD0E0}
.note{font-size:11px;color:var(--faint);line-height:1.5}
.inp{padding:5px 7px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  font-family:var(--mono);font-size:12px;color:var(--text);width:100%}
select.inp{font-family:var(--sans)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow button{padding:6px 0;border-radius:3px;font-size:11px;background:var(--bg);
  border:1px solid var(--line);color:var(--faint)}
.dow button[aria-pressed="true"]{background:var(--accent-ghost);border-color:var(--accent-dim);
  color:var(--accent);font-weight:600}
.slots{display:flex;flex-direction:column;gap:5px}
.slot{display:flex;align-items:center;gap:5px}
.slot .inp{flex:1;text-align:center;padding:4px 2px}
.slot .x{padding:2px 6px;color:var(--faint);font-size:14px;line-height:1}
.slot .x:hover{color:var(--error)}
.addslot{padding:5px;border:1px dashed var(--line);border-radius:var(--r);
  font-size:11px;color:var(--faint);width:100%}
.addslot:hover{border-color:var(--accent-dim);color:var(--accent)}
.range{display:flex;align-items:center;gap:6px}
.range .inp{flex:1}
.danger{padding:6px;border:1px solid rgba(255,107,90,.35);border-radius:var(--r);
  color:#FF9084;font-size:11.5px;width:100%}
.danger:hover{background:rgba(255,107,90,.09)}

/* ── status ─────────────────────────────────────── */
.status{flex:0 0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 14px;
  height:30px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.status .k{display:inline-flex;align-items:center;gap:5px}
kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;
  background:var(--raised);border:1px solid var(--line);color:var(--dim)}
.status .right{margin-left:auto;display:flex;gap:14px;align-items:center}

.overlay{position:fixed;inset:0;z-index:80;background:rgba(6,9,11,.68);
  display:flex;align-items:flex-start;justify-content:center;padding-top:14vh}
.overlay[hidden]{display:none}
.palette{width:min(520px,92vw);background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 24px 64px rgba(0,0,0,.6);overflow:hidden}
.palette input{width:100%;padding:13px 16px;background:transparent;border:0;
  border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-size:14px}
.palette ul{list-style:none;margin:0;padding:6px;max-height:300px;overflow-y:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);
  cursor:pointer;font-size:12.5px}
.palette li[aria-selected="true"]{background:var(--accent-ghost);color:var(--accent)}
.palette li .sc{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}

.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:90;
  padding:8px 16px;border-radius:20px;background:var(--raised);border:1px solid var(--line);
  font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast[hidden]{display:none}

/* ── 출력 관리 ──────────────────────────────────── */
.out-wrap{padding:14px 16px 30px;display:flex;flex-direction:column;gap:18px}
.out-sec h3{margin:0 0 9px;font-size:10px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.out-sec .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.out-sec .hd h3{margin:0}
.map{position:relative;background:#0B0E10;border:1px solid var(--line-soft);
  border-radius:6px;padding:14px;overflow:auto}
.mon{position:absolute;border-radius:4px;border:1px solid;padding:6px 7px;
  display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden;
  background:var(--panel2);border-color:var(--line);transition:border-color .12s}
.mon:hover{border-color:var(--accent-dim)}
.mon .num{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1;color:var(--dim)}
.mon .res{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.mon .own{font-size:10px;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon.mine{background:var(--accent-ghost);border-color:var(--accent-dim)}
.mon.mine .num,.mon.mine .own{color:var(--accent)}
.mon.other{background:rgba(255,167,38,.08);border-color:rgba(255,167,38,.3)}
.mon.other .own{color:var(--next)}
.mon.free{border-style:dashed}
.mon.free .own{color:var(--faint)}
.mon.off{opacity:.45;border-style:dashed;cursor:not-allowed}
.mon.off .own{color:var(--error)}
.mon.sel{outline:2px solid var(--accent);outline-offset:1px}
.mon .pri{position:absolute;top:5px;right:6px;font-size:8.5px;color:var(--faint);
  letter-spacing:.05em}

.orow{display:grid;grid-template-columns:26px minmax(0,1fr) 76px 68px 34px 62px 26px;
  align-items:center;gap:8px;padding:8px 9px;border-radius:var(--r);cursor:pointer;
  border:1px solid transparent}
.orow:hover{background:var(--panel2)}
.orow.sel{background:var(--accent-ghost);border-color:var(--accent-dim)}
.orow .ic{font-size:14px;text-align:center}
.orow .nm{min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .nm em{font-style:normal;color:var(--faint);font-size:11px}
.orow .mono{font-size:11px;color:var(--dim)}
.orow .sc{font-size:11px;color:var(--dim)}
.orow .au{text-align:center;font-size:13px;border-radius:4px;padding:2px 0}
.orow .au.on{background:rgba(91,201,140,.14)}
.orow .au.off{opacity:.35}
.orow .st{font-size:10px;text-align:center;border-radius:3px;padding:2px 0}
.st.run{background:rgba(91,201,140,.14);color:var(--ready)}
.st.stop{background:rgba(255,107,90,.14);color:var(--error)}
.orow .del{color:var(--faint);font-size:14px;line-height:1;text-align:center}
.orow .del:hover{color:var(--error)}
.addout{display:flex;gap:6px;margin-top:8px}
.addout button{flex:1;padding:8px;border:1px dashed var(--line);border-radius:var(--r);

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ══ 시간 유틸 ══════════════════════════════════ */
const hms = s => { s=Math.max(0,Math.round(s));
  return [Math.floor(s/3600)%24,Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,"0")).join(":"); };
const hm  = s => { s=Math.max(0,Math.round(s));
  return [Math.floor(s/3600)%24,Math.floor(s%3600/60)].map(n=>String(n).padStart(2,"0")).join(":"); };
const ms  = s => { s=Math.max(0,Math.round(s));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const dur2 = s => Math.floor(s/3600)+"시간 "+Math.round(s%3600/60)+"분";
const parseHM = v => { const p=String(v).split(":").map(Number);
  return (p.length>=2 && p.every(n=>!isNaN(n))) ? p[0]*3600+p[1]*60 : null; };

const DOW = ["월","화","수","목","금","토","일"];
const SRC = { local:{k:"로컬"},folder:{k:"폴더"},yt:{k:"YT"},cf:{k:"CF"},bunny:{k:"Bunny"} };

/* ══ 소스 그룹(풀) ══════════════════════════════ */
const POOLS = {
  sermon:{ name:"설교 아카이브", src:"folder", color:"#C9A15A", items:[
    ["창세기 강해 1","2415"],["창세기 강해 2","2280"],["창세기 강해 3","2510"],
    ["로마서 강해 1","2650"],["로마서 강해 2","2390"],["시편 묵상 특강","1980"]]},
  lecture:{ name:"특강 시리즈", src:"cf", color:"#E0873A", items:[
    ["시작하는 사람들 1부","1695"],["시작하는 사람들 2부","1880"],
    ["관계의 기술","2140"],["일과 소명","1760"],["세대를 잇다","2005"]]},
  worship:{ name:"찬양 라이브 모음", src:"yt", color:"#B85A52", items:[
    ["찬양 라이브 8월","1360"],["어쿠스틱 세션","1120"],["새벽 찬양","980"],
    ["연합 찬양제 하이라이트","1640"]]},
  interview:{ name:"인터뷰 아카이브", src:"bunny", color:"#9B7BC4", items:[
    ["현장 스케치","1085"],["사람과 이야기 1","1240"],["사람과 이야기 2","1310"]]},
  spot:{ name:"브리지 · 스팟", src:"local", color:"#8FA3B0", items:[
    ["채널 ID","10"],["오프닝 스팅어","15"],["브리지 루프","180"],
    ["안내 스팟","45"],["클로징","70"],["필러 영상 A","300"],["필러 영상 B","420"]]}
};
Object.keys(POOLS).forEach(k=>{
  POOLS[k].id=k;
  POOLS[k].items=POOLS[k].items.map(([t,d])=>({title:t,dur:+d,src:POOLS[k].src,pool:k}));
  POOLS[k].total=POOLS[k].items.reduce((a,b)=>a+b.dur,0);
});

/* ══ 상태 ═══════════════════════════════════════ */
let view = "grid";
let NOW = 9*3600 + 24*60 + 30;
const TODAY = 4;                       // 금요일 (2026-08-28)
let selDay = TODAY;
let uid = 100;
const nid = () => "x"+(uid++);

let blocks = [
  { id:nid(), name:"주일 설교 재방송", pool:"sermon", days:[6],
    slots:[[9*3600,12*3600],[19*3600,21*3600]],
    from:"2026-08-01", to:"2026-12-31", order:"seq", fit:"loop" },
  { id:nid(), name:"평일 특강", pool:"lecture", days:[0,1,2,3,4],
    slots:[[10*3600,12*3600]],
    from:"2026-08-01", to:"2026-10-31", order:"unaired", fit:"filler" },
  { id:nid(), name:"찬양 블록", pool:"worship", days:[0,1,2,3,4,5,6],
    slots:[[6*3600,8*3600],[22*3600,24*3600]],
    from:"2026-08-01", to:"2026-12-31", order:"random", fit:"loop" },
  { id:nid(), name:"인터뷰 재방송", pool:"interview", days:[1,3],
    slots:[[14*3600,15*3600+30*60]],
    from:"2026-08-01", to:"2026-09-30", order:"seq", fit:"trim" }
];
let auto = { on:false, pools:["spot","interview"], order:"random" };

/* ── 모니터 · 채널 · 출력 ── */
const MONITORS = [
  { id:"m1", name:"DELL U2720Q",  w:1920, h:1080, x:0,    y:0,    primary:true,  on:true  },
  { id:"m2", name:"LG 27UL550",   w:1920, h:1080, x:1920, y:0,    primary:false, on:true  },
  { id:"m3", name:"ASUS PA248",   w:1080, h:1920, x:3840, y:0,    primary:false, on:true  },
  { id:"m4", name:"BenQ EW2780",  w:1920, h:1080, x:0,    y:1080, primary:false, on:false }
];
const AUDIO_DEV = ["시스템 기본","BlackHole 2ch (#1)","BlackHole 2ch (#2)","USB Audio CODEC"];
const MAX_MONITOR_OUT = 4;

let channels = [
  { id:"c1", name:"채널 1 — 재방송", master:"1920×1080", outputs:[
    { id:"o1", type:"monitor",        mon:"m1", w:1920, h:1080, scale:"fit",  audio:true,  dev:"BlackHole 2ch (#1)", state:"running" },
    { id:"o2", type:"capture_window", mon:"m2", w:1920, h:1080, scale:"none", audio:false, dev:"시스템 기본",        state:"running" }]},
  { id:"c2", name:"채널 2 — 음악",   master:"1080×1920", outputs:[
    { id:"o3", type:"monitor",        mon:"m3", w:1080, h:1920, scale:"fit",  audio:true,  dev:"BlackHole 2ch (#2)", state:"running" }]},
  { id:"c3", name:"채널 3 — 행사",   master:"1920×1080", outputs:[] }
];
let selCh = "c1", selOut = null;
const OTYPE = {
  monitor:        { ic:"🖥", k:"모니터 직출력" },
  capture_window: { ic:"⬚", k:"창 캡처 (OBS·vMix)" },
  ndi:            { ic:"◈", k:"NDI 출력" }
};
const SCALES = [["none","1:1"],["fit","여백맞춤"],["fill","꽉채움"],["stretch","늘림"]];
const ch = () => channels.find(c => c.id === selCh);
const allOuts = () => channels.flatMap(c => c.outputs.map(o => ({ o, c })));
const monOwner = mid => allOuts().find(x => x.o.type === "monitor" && x.o.mon === mid);
const monOutCount = () => allOuts().filter(x => x.o.type === "monitor").length;
let selBlock = null, selItem = null;
let rundown = null, rundownDirty = false;
const undoStack = [];
const snap = () => { undoStack.push(JSON.stringify({blocks,auto,rundown,rundownDirty,channels}));
  if (undoStack.length>50) undoStack.shift(); };

/* ══ 커버리지 ═══════════════════════════════════ */
function daySlots(day){
  const out=[];
  blocks.forEach(b=>{ if(!b.days.includes(day)) return;
    b.slots.forEach(([a,z])=>out.push({a,z,b})); });
  return out.sort((p,q)=>p.a-q.a);
}
function gapsOf(day){
  const s=daySlots(day), g=[]; let cur=0;
  s.forEach(x=>{ if(x.a>cur) g.push([cur,x.a]); cur=Math.max(cur,x.z); });
  if(cur<86400) g.push([cur,86400]);
  return g;
}
function coverage(){
  let booked=0;
  for(let d=0;d<7;d++) daySlots(d).forEach(x=>booked+=x.z-x.a);
  return { booked, total:7*86400 };
}

/* ══ 런다운 생성 ════════════════════════════════ */
function poolSeq(poolId, order, seed){
  const arr = POOLS[poolId].items.slice();
  if(order==="random"){
    let s=seed*9301+49297;
    for(let i=arr.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]]; }
  } else if(order==="unaired"){ arr.reverse(); }
  return arr;
}
function fillSlot(out, a, z, poolIds, order, fit, seed, blockName){
  let t=a, k=0;
  const seqs = poolIds.map((p,i)=>poolSeq(p,order,seed+i));
  const flat = []; let n=0, guard=0;
  while(guard++<400){ let added=false;
    seqs.forEach(s=>{ if(n<s.length){ flat.push(s[n]); added=true; } });
    n++; if(!added) break;
  }
  if(!flat.length) return;
  while(t<z && k<500){
    const src = flat[k % flat.length];
    const left = z-t;
    if(src.dur<=left){
      out.push(mkItem(src, blockName)); t+=src.dur; k++;
      if(fit!=="loop" && k>=flat.length) break;
    } else {
      if(fit==="trim"){ const c=Object.assign(mkItem(src,blockName),{dur:left,trimmed:true}); out.push(c); t=z; }
      else if(fit==="filler"){
        const f=POOLS.spot.items.filter(x=>x.dur<=left).sort((p,q)=>q.dur-p.dur)[0];
        if(f && left>=10){ out.push(Object.assign(mkItem(f,blockName),{filler:true})); t+=f.dur; }
        else break;
      } else break;
      if(fit==="trim") break;
    }
  }
}
function mkItem(src, blockName){
  return { id:nid(), title:src.title, dur:src.dur, src:src.src, block:blockName||null,
    timing:"none", fixedAt:null, filler:!!src.filler, pinned:false };
}
function generate(){
  const out=[];
  const slots=daySlots(selDay);
  let cur=0;
  slots.forEach((s,i)=>{
    if(s.a>cur && auto.on) fillSlot(out,cur,s.a,auto.pools,auto.order,"loop",i+7,"자동 채움");
    if(s.a>cur && !auto.on) out.push({ id:nid(), gapMark:true, from:cur, to:s.a });
    // 블록 시작을 정시로 고정
    const first=out.length;
    fillSlot(out,s.a,s.z,[s.b.pool],s.b.order,s.b.fit,i+1,s.b.name);
    if(out[first]) { out[first].timing="hard"; out[first].fixedAt=s.a; }
    cur=Math.max(cur,s.z);
  });
  if(cur<86400){
    if(auto.on) fillSlot(out,cur,86400,auto.pools,auto.order,"loop",99,"자동 채움");
    else out.push({ id:nid(), gapMark:true, from:cur, to:86400 });
  }
  rundown = out.filter(x=>!x.gapMark);
  rundownGaps = out.filter(x=>x.gapMark);
  rundownDirty = false;
}
let rundownGaps = [];

function schedule(){
  if(!rundown) generate();
  const out=[]; let cur=0;
  rundown.forEach((it,i)=>{
    let start=cur, gap=0, cut=0, push=0;
    if(it.timing!=="none" && it.fixedAt!=null){
      const f=it.fixedAt;
      if(it.timing==="hard"){ if(cur>f) cut=cur-f; else if(cur<f) gap=f-cur; start=f; }
      else if(it.timing==="soft"){ if(cur>f){push=cur-f;start=cur;} else {gap=f-cur;start=f;} }
      else { if(cur<f){gap=f-cur;start=f;} else start=cur; }
    }
    out.push({it,i,start,end:start+it.dur,gap,cut,push});
    cur=start+it.dur;
  });
  return out;
}

/* ══ 렌더 ═══════════════════════════════════════ */

}

/* ── 주간 편성 그리드 ── */
function renderGrid(){
  const b=$("centerBody");
  let html='<div class="grid-wrap"><div class="grid-days"><div></div>'+
    DOW.map((d,i)=>'<div class="'+(i===TODAY?"today ":"")+(i===6?"sun":"")+'">'+d+"</div>").join("")+
    '</div><div class="grid"><div class="hours">'+
    Array.from({length:24},(_,h)=>'<div class="hour">'+(h?String(h).padStart(2,"0"):"")+"</div>").join("")+
    '</div>';

  for(let d=0; d<7; d++){
    html+='<div class="daycol'+(d===TODAY?" today":"")+'" data-day="'+d+'" style="height:624px">';
    for(let h=1;h<24;h++) html+='<div class="hline'+(h%6===0?" major":"")+'" style="top:'+(h*26)+'px"></div>';
    blocks.forEach(bl=>{ if(!bl.days.includes(d)) return;
      bl.slots.forEach(([a,z])=>{
        const top=a/3600*26, hgt=Math.max(15,(z-a)/3600*26);
        const c=POOLS[bl.pool].color;
        html+='<div class="blk'+(selBlock===bl.id?" sel":"")+'" data-blk="'+bl.id+'" '+
          'style="top:'+top+'px;height:'+hgt+'px;background:'+c+'22;border-color:'+c+'66;color:'+c+'">'+
          "<b>"+esc(bl.name)+"</b><span>"+hm(a)+"–"+hm(z)+"</span></div>";
      });
    });
    if(auto.on) gapsOf(d).forEach(([a,z])=>{
      if(z-a<600) return;
      html+='<div class="blk auto" style="top:'+(a/3600*26)+'px;height:'+
        Math.max(15,(z-a)/3600*26)+'px"><b>자동 채움</b><span>'+hm(a)+"–"+hm(z===86400?0:z)+"</span></div>";
    });
    if(d===TODAY) html+='<div class="nowline" style="top:'+(NOW/3600*26)+'px"></div>';
    html+="</div>";
  }
  b.innerHTML = html+"</div></div>";

  b.querySelectorAll("[data-blk]").forEach(el =>
    el.addEventListener("pointerdown", e => { e.stopPropagation();
      selBlock=el.dataset.blk; selItem=null; render(); }));

  const c=coverage(), pb=c.booked/c.total*100, pa=auto.on?100-pb:0;
  $("covB").style.width=pb+"%"; $("covA").style.width=pa+"%";
  $("coverTxt").textContent = "블록 편성 "+Math.round(c.booked/3600)+"시간"+
    (auto.on ? " · 자동 채움 "+Math.round((c.total-c.booked)/3600)+"시간" : "");
  $("coverPct").textContent = Math.round(pb+pa)+"% 편성";
  $("stB").textContent = (pb+pa>=99.5) ? "✓ 24시간 편성 완료" : "⚠ 빈 시간 "+
    Math.round((c.total-c.booked)/3600)+"시간";
  $("stB").style.color = (pb+pa>=99.5) ? "var(--ready)" : "var(--warn)";
}

/* 빈 시간 드래그 → 블록 생성 */
let gdrag=null;
document.addEventListener("pointerdown", e=>{
  const col=e.target.closest(".daycol"); if(!col||view!=="grid"||e.target.closest(".blk")) return;
  const r=col.getBoundingClientRect();
  gdrag={ day:+col.dataset.day, col, y0:e.clientY-r.top, y1:e.clientY-r.top, el:null };
});
document.addEventListener("pointermove", e=>{
  if(!gdrag) return;
  const r=gdrag.col.getBoundingClientRect();
  gdrag.y1=Math.max(0,Math.min(624,e.clientY-r.top));
  if(!gdrag.el && Math.abs(gdrag.y1-gdrag.y0)>6){
    gdrag.el=document.createElement("div");
    gdrag.el.className="blk ghost";
    gdrag.el.style.cssText="background:var(--accent-ghost);border-color:var(--accent-dim);color:var(--accent)";
    gdrag.col.appendChild(gdrag.el);
  }
  if(gdrag.el){
    const t=Math.min(gdrag.y0,gdrag.y1), h=Math.abs(gdrag.y1-gdrag.y0);
    gdrag.el.style.top=t+"px"; gdrag.el.style.height=h+"px";
    gdrag.el.innerHTML="<b>새 블록</b><span>"+hm(snapT(t))+"–"+hm(snapT(t+h))+"</span>";
  }
});
document.addEventListener("pointerup", ()=>{
  if(!gdrag) return; const g=gdrag; gdrag=null;
  if(!g.el) return;
  const t=snapT(Math.min(g.y0,g.y1)), z=snapT(Math.max(g.y0,g.y1));
  g.el.remove();
  if(z-t < 1800) return toast("30분 이상으로 지정하세요");
  snap();
  const nb={ id:nid(), name:"새 편성 블록", pool:"sermon", days:[g.day], slots:[[t,z]],
    from:"2026-08-01", to:"2026-12-31", order:"seq", fit:"loop" };
  blocks.push(nb); selBlock=nb.id; rundown=null; render();
  toast(DOW[g.day]+"요일 "+hm(t)+"–"+hm(z)+" 블록 생성 — 인스펙터에서 설정하세요");
});
const snapT = px => Math.round(px/26*4)/4*3600;   // 15분 스냅

/* ── 런다운 ── */
function renderRundown(){
  const sc=schedule(); const b=$("centerBody");
  b.innerHTML='<div class="rows" id="rows"></div>';
  const rows=$("rows"); let issues=0;

  rundownGaps.forEach(g=>{
    if(g.to-g.from<60) return; issues++;
    rows.appendChild(warnRow("gap",
      "<b>"+hm(g.from)+"</b> ~ <b>"+hm(g.to===86400?0:g.to)+"</b> 편성 없음 — "+dur2(g.to-g.from),
      [["자동 채움 켜기",()=>{ auto.on=true; rundown=null; render(); }]]));
  });

  sc.forEach(r=>{
    const {it,start,end,gap,cut,push}=r;
    if(gap>0.5){ issues++; rows.appendChild(warnRow("gap",
      ms(gap)+" 공백 — <b>"+hms(start-gap)+"</b> ~ <b>"+hms(start)+"</b>",
      [["필러 채우기",()=>fillGap(r.i,gap)],["앞 항목 늘리기",()=>stretchPrev(r.i,gap)]])); }
    if(cut>0.5){ issues++; rows.appendChild(warnRow("cut",
      "앞 항목이 <b>"+ms(cut)+"</b> 잘림 — 블록 시작이 <b>"+hms(start)+"</b>에 끊습니다",
      [["Soft로 변경",()=>setTiming(it.id,"soft")],["앞 항목 자르기",()=>trimPrev(r.i,cut)]])); }
    if(push>0.5){ issues++; rows.appendChild(warnRow("gap",
      "<b>"+ms(push)+"</b> 밀림 — Soft 마커라 앞 항목을 끝까지 재생합니다",[])); }

    const onair = selDay===TODAY && start<=NOW && NOW<end;
    const nextI = selDay===TODAY ? sc.findIndex(x=>x.start>NOW) : -1;
    const locked = onair || r.i===nextI;
    const el=document.createElement("div");
    el.className="row "+(onair?"s-onair":r.i===nextI?"s-next":it.filler?"s-filler":"s-ready")
      +(selDay===TODAY&&end<=NOW?" past":"")+(locked?" locked":"")+(it.id===selItem?" sel":"");
    el.dataset.id=it.id; el.tabIndex=0;
    const mark = it.timing==="hard"?'<span class="mark hard">HARD</span>'
      : it.timing==="soft"?'<span class="mark soft">SOFT</span>'
      : it.timing==="notBefore"?'<span class="mark nb">NOT BEFORE</span>':"";
    el.innerHTML='<div class="stripe"></div><div class="grip">'+(locked?"🔒":"⣿")+'</div>'+
      '<div class="time mono">'+hms(start)+'</div>'+
      '<div class="title"><span class="dot '+it.src+'"></span><span class="n">'+esc(it.title)+'</span>'+
        (it.block?'<span class="mark blk">· '+esc(it.block)+"</span>":"")+
        (it.trimmed?'<span class="mark blk" style="color:var(--warn)">잘림</span>':"")+'</div>'+
      '<div class="marks">'+mark+'<span class="badge">'+SRC[it.src].k+'</span></div>'+
      '<div class="dur mono">'+ms(it.dur)+"</div>";
    rows.appendChild(el);
  });

  const oa = selDay===TODAY ? sc.find(r=>r.start<=NOW&&NOW<r.end) : null;
  const nx = selDay===TODAY ? sc.find(r=>r.start>NOW) : sc[0];
  $("oaTitle").textContent = oa?oa.it.title:(selDay===TODAY?"대기 화면 (로고)":"오늘이 아닌 요일 — 미리보기");
  $("oaRem").textContent = oa?"−"+ms(oa.end-NOW):"--:--";
  $("oaMeta").textContent = oa?(oa.it.block?oa.it.block+" · ":"")+hms(oa.start)+" – "+hms(oa.end):"편성 미리보기";
  $("oaNext").textContent = nx?"다음 "+hms(nx.start)+" · "+nx.it.title:"—";
  $("oaFill").style.width = oa?((NOW-oa.start)/oa.it.dur*100).toFixed(1)+"%":"0%";

  const tag=$("dirtyTag"); if(tag){ tag.textContent = rundownDirty?"● 손으로 수정함":"";
    tag.style.color="var(--warn)"; }
  const total = sc.length?sc[sc.length-1].end:0;
  $("stB").textContent = issues?"⚠ 확인 필요 "+issues+"건":"✓ "+dur2(total)+" 편성 완료";
  $("stB").style.color = issues?"var(--warn)":"var(--ready)";
  const ub=$("undoBtn"); if(ub) ub.disabled=!undoStack.length;
}

function warnRow(kind,html,actions){
  const d=document.createElement("div");
  d.className="warn"+(kind==="cut"?" cut":"");
  d.innerHTML='<span>'+(kind==="cut"?"🔴":"⚠")+'</span><span class="msg">'+html+"</span>";
  actions.forEach(([l,fn])=>{ const b=document.createElement("button");
    b.textContent=l; b.onclick=e=>{e.stopPropagation();fn();}; d.appendChild(b); });
  return d;
}

/* ══ 출력 관리 ═══════════════════════════════════ */
function renderOutputs(){
  const c=ch(), b=$("centerBody");
  const bw=Math.max(...MONITORS.map(m=>m.x+m.w)), bh=Math.max(...MONITORS.map(m=>m.y+m.h));

  let map='<div class="map" style="width:'+(bw*k+28)+'px;height:'+(bh*k+28)+'px;margin:0 auto">';
  MONITORS.forEach((m,i)=>{
    const own=monOwner(m.id);
    const mine=own && own.c.id===selCh;
    const caps=allOuts().filter(x=>x.o.type!=="monitor" && x.o.mon===m.id);
    const cls = !m.on ? "off" : mine ? "mine" : own ? "other" : caps.length ? "other" : "free";
    const sel = mine && own.o.id===selOut ? " sel" : "";
    const label = !m.on ? "⚠ 연결 끊김"

    map+='<div class="mon '+cls+sel+'" data-mon="'+m.id+'" style="left:'+(m.x*k+14)+
      'px;top:'+(m.y*k+14)+'px;width:'+(m.w*k)+'px;height:'+(m.h*k)+'px">'+
      (m.primary?'<span class="pri">주</span>':"")+
      '<span class="num">'+(i+1)+'</span>'+
      '<span class="res">'+m.w+"×"+m.h+"</span>"+
      '<span class="own">'+label+"</span></div>";
  });
  map+="</div>";

  const rows = c.outputs.length ? c.outputs.map(o=>{
    const m=MONITORS.find(x=>x.id===o.mon);
    const off=o.type!=="ndi" && m && !m.on;
    return '<div class="orow'+(o.id===selOut?" sel":"")+'" data-out="'+o.id+'">'+
      '<span class="ic">'+OTYPE[o.type].ic+'</span>'+
      '<span class="nm">'+OTYPE[o.type].k+
        (m?' <em>· '+esc(m.name)+"</em>":"")+"</span>"+
      '<span class="mono">'+o.w+"×"+o.h+"</span>"+
      '<span class="sc">'+(SCALES.find(s=>s[0]===o.scale)||["","—"])[1]+"</span>"+
      '<span class="au '+(o.audio?"on":"off")+'" data-au="'+o.id+'" title="이 출력에서 소리">'+
        (o.audio?"🔊":"🔇")+"</span>"+
      '<span class="st '+(off?"stop":"run")+'">'+(off?"끊김":"송출")+"</span>"+
      '<span class="del" data-del="'+o.id+'">×</span></div>';
  }).join("") : '<div class="note" style="padding:10px 4px">출력이 없습니다. 위 배치도에서 빈 모니터를 클릭하거나 아래에서 추가하세요.</div>';

  const monFull = monOutCount() >= MAX_MONITOR_OUT;
  const add='<div class="addout">'+
    '<button id="addMon"'+(monFull?" disabled":"")+'>+ 모니터 직출력'+
      (monFull?" (최대 "+MAX_MONITOR_OUT+"개)":"")+"</button>"+
    '<button id="addCap">+ 창 캡처</button>'+
    '<button id="addNdi" disabled>+ NDI (조건부 · 미구현)</button></div>';

  const used=allOuts().length, cap=4;
  const pct=Math.min(100, used/cap*100);
  const load='<div class="load"><span>디코더 '+used+' / 권장 '+cap+'</span>'+
    '<div class="bar"><i class="'+(used>cap?"hot":"")+'" style="width:'+pct+'%"></i></div>'+
    '<span class="mono">'+(used>cap?"⚠ 초과":"여유")+"</span></div>"+
    (c.outputs.length>=3
      ? '<div class="tipbox">출력이 3개 이상입니다. 여러 모니터에 <b>같은 화면</b>을 띄우는 것이 목적이라면 앱 미러 대신 <b>OS 디스플레이 미러링</b>을 쓰십시오 — 디코딩이 1회로 줄어듭니다.</div>'
      : "");

  b.innerHTML='<div class="out-wrap">'+
    '<div class="out-sec"><h3>감지된 모니터 · 전 채널 공용</h3>'+map+"</div>"+
    '<div class="out-sec"><div class="hd"><h3>'+esc(c.name)+"의 출력</h3></div>"+rows+add+"</div>"+
    '<div class="out-sec"><h3>자원</h3>'+load+"</div></div>";

  b.querySelectorAll("[data-mon]").forEach(el=>el.onclick=()=>clickMon(el.dataset.mon));
  b.querySelectorAll("[data-out]").forEach(el=>el.onclick=e=>{
    if(e.target.dataset.au||e.target.dataset.del) return;
    selOut=el.dataset.out; render(); });
  b.querySelectorAll("[data-au]").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); setAudio(el.dataset.au); });
  b.querySelectorAll("[data-del]").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); delOutput(el.dataset.del); });
  $("addMon").onclick=()=>{
    const free=MONITORS.find(m=>m.on && !monOwner(m.id));
    if(!free) return toast("배정할 수 있는 빈 모니터가 없습니다");
    clickMon(free.id); };
  $("addCap").onclick=()=>addOutput("capture_window", MONITORS[0].id);
}

function clickMon(mid){
  const m=MONITORS.find(x=>x.id===mid);
  if(!m.on) return toast(m.name+" — 연결이 끊겨 있습니다. 재연결하면 자동 복귀합니다");
  const own=monOwner(mid);
  if(own && own.c.id===selCh){ selOut=own.o.id; render(); return; }
  if(own){
    if(!confirm(own.c.name+"에서 "+m.name+"을(를) 가져올까요?")) return;
    snap();
    own.c.outputs=own.c.outputs.filter(o=>o.id!==own.o.id);
    addOutput("monitor", mid, true);
    toast(own.c.name+"에서 가져왔습니다"); return;
  }
  if(monOutCount()>=MAX_MONITOR_OUT) return toast("모니터 출력은 최대 "+MAX_MONITOR_OUT+"개입니다");
  addOutput("monitor", mid);
}
function addOutput(type, mid, noSnap){
  if(!noSnap) snap();
  const m=MONITORS.find(x=>x.id===mid), c=ch();
  const o={ id:nid(), type, mon:mid, w:m.w, h:m.h,
    scale: (m.w+"×"+m.h)===c.master ? "none" : "fit",
    audio: c.outputs.length===0, dev: AUDIO_DEV[0], state:"running" };
  c.outputs.push(o); selOut=o.id; render();
  toast(OTYPE[type].k+" 추가 — "+m.name);
}
function delOutput(id){
  snap(); const c=ch(); const o=c.outputs.find(x=>x.id===id);
  c.outputs=c.outputs.filter(x=>x.id!==id);
  if(o.audio && c.outputs.length) c.outputs[0].audio=true;   // 오디오 자동 승계
  if(selOut===id) selOut=null;
  render(); toast(OTYPE[o.type].k+" 삭제 — ⌘Z로 되돌리기");
}
function setAudio(id){
  snap(); const c=ch();
  const t=c.outputs.find(o=>o.id===id);
  if(t.audio){ return toast("채널당 하나는 소리를 내야 합니다"); }
  c.outputs.forEach(o=>o.audio=(o.id===id));   // 라디오 동작
  render(); toast("오디오 담당을 옮겼습니다 — 나머지는 자동 음소거");
}
const sboxHTML = mode => {
  const st={ none:"left:9px;top:5px;width:20px;height:13px",
             fit:"left:2px;top:5px;width:33px;height:13px",
             fill:"left:2px;top:-2px;width:33px;height:27px",
             stretch:"left:2px;top:2px;width:33px;height:19px" }[mode];
  return '<span class="sbox"><i style="'+st+'"></i></span>';
};

function bindBlock(bl){
  const re=()=>{ rundown=null; render(); };
  $("bName").onchange=e=>{ snap(); bl.name=e.target.value||"이름 없음"; re(); };
  $("bPool").onchange=e=>{ snap(); bl.pool=e.target.value; re(); };
  $("bFrom").onchange=e=>{ snap(); bl.from=e.target.value; re(); };
  $("bTo").onchange=e=>{ snap(); bl.to=e.target.value; re(); };
  document.querySelectorAll("#bDow button").forEach(b=>b.onclick=()=>{
    snap(); const d=+b.dataset.d;
    bl.days = bl.days.includes(d) ? bl.days.filter(x=>x!==d) : [...bl.days,d].sort();
    if(!bl.days.length) bl.days=[d];
    re(); });
  document.querySelectorAll("#bSlots .inp").forEach(inp=>inp.onchange=()=>{
    const v=parseHM(inp.value); if(v==null) return re();
    snap(); const i=+inp.dataset.s;
    if(inp.dataset.e==="a") bl.slots[i][0]=v; else bl.slots[i][1]=v===0?86400:v;
    if(bl.slots[i][1]<=bl.slots[i][0]) bl.slots[i][1]=bl.slots[i][0]+1800;
    re(); });
  document.querySelectorAll("#bSlots [data-del]").forEach(b=>b.onclick=()=>{
    if(bl.slots.length<2) return toast("시간대는 최소 하나 필요합니다");
    snap(); bl.slots.splice(+b.dataset.del,1); re(); });
  $("bAdd").onclick=()=>{ snap();
    const last=bl.slots[bl.slots.length-1][1];
    const a=Math.min(last+3600,82800); bl.slots.push([a,Math.min(a+3600,86400)]); re(); };
  document.querySelectorAll("#bOrder button").forEach(b=>b.onclick=()=>{ snap(); bl.order=b.dataset.o; re(); });
  document.querySelectorAll("#bFit button").forEach(b=>b.onclick=()=>{ snap(); bl.fit=b.dataset.f; re(); });
  $("bDel").onclick=()=>{ snap(); blocks=blocks.filter(x=>x.id!==bl.id); selBlock=null; re();
    toast("블록 삭제 — ⌘Z로 되돌리기"); };
}

let drag=null;
const line=document.createElement("div"); line.className="drop-line"; line.hidden=true;
const tip=document.createElement("div"); tip.className="drop-tip"; tip.hidden=true;
const gh=document.createElement("div"); gh.className="ghost"; gh.hidden=true;
document.body.append(line,tip,gh);

document.addEventListener("pointerdown",e=>{
  if(view!=="rundown") return;
  const row=e.target.closest(".row"), lib=e.target.closest(".lib-item");
  if(row){ selItem=row.dataset.id; selBlock=null; render();
    if(!row.classList.contains("locked"))
      drag={kind:"move",id:row.dataset.id,x:e.clientX,y:e.clientY,live:false,
            label:rundown.find(i=>i.id===row.dataset.id).title};
  } else if(lib){
    const [pid,i]=lib.dataset.lib.split(":"); const src=POOLS[pid].items[+i];
    drag={kind:"add",src,x:e.clientX,y:e.clientY,live:false,label:src.title};
  }
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.live){ if(Math.abs(e.clientY-drag.y)+Math.abs(e.clientX-drag.x)<5) return;
    drag.live=true; gh.textContent=drag.label; gh.hidden=false;
    document.querySelector('[data-id="'+drag.id+'"]')?.classList.add("dragging"); }
  gh.style.left=e.clientX+"px"; gh.style.top=e.clientY+"px";
  const t=dropTarget(e.clientY); drag.index=t.index;
  const box=$("centerBody").getBoundingClientRect();
  line.hidden=tip.hidden=false;
  line.style.left=box.left+12+"px"; line.style.width=box.width-24+"px"; line.style.top=t.y+"px";
  tip.textContent=hms(predictStart(t.index));
  tip.style.left=box.right-84+"px"; tip.style.top=t.y+"px";
});
document.addEventListener("pointerup",()=>{
  if(!drag) return; const d=drag; drag=null;
  line.hidden=tip.hidden=gh.hidden=true;
  document.querySelectorAll(".dragging").forEach(el=>el.classList.remove("dragging"));
  if(!d.live||d.index==null) return;
  snap();
  if(d.kind==="move"){
    const from=rundown.findIndex(i=>i.id===d.id); let to=d.index; if(to>from) to--;
    if(to===from){ undoStack.pop(); return; }
    rundown.splice(to,0,rundown.splice(from,1)[0]); selItem=d.id;
  } else { const n=mkItem(d.src,null); rundown.splice(d.index,0,n); selItem=n.id;
    toast(d.src.title+" 추가"); }
  rundownDirty=true; render(); flash();
});
function dropTarget(y){
  const rows=[...document.querySelectorAll(".row")];
  if(!rows.length) return {index:0,y:$("centerBody").getBoundingClientRect().top};
  for(let i=0;i<rows.length;i++){ const r=rows[i].getBoundingClientRect();
    if(y<r.top+r.height/2) return {index:i,y:r.top}; }
  return {index:rows.length,y:rows[rows.length-1].getBoundingClientRect().bottom};
}
function predictStart(i){ const sc=schedule();
  return i<sc.length?sc[i].start:(sc.length?sc[sc.length-1].end:0); }
function flash(){ document.querySelectorAll(".row").forEach(r=>{
  r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash"); }); }

/* ══ 런다운 액션 ════════════════════════════════ */
function fillGap(i,gap){ snap();
  rundown.splice(i,0,mkItem({title:"브리지 루프",dur:Math.round(gap),src:"local",filler:true},null));
  rundownDirty=true; render(); toast("필러로 공백 "+ms(gap)+"을 메웠습니다"); }
function stretchPrev(i,gap){ if(i===0) return toast("앞에 늘릴 항목이 없습니다");
  snap(); rundown[i-1].dur+=Math.round(gap); rundownDirty=true; render(); toast("앞 항목을 "+ms(gap)+" 늘렸습니다"); }
function trimPrev(i,cut){ if(i===0) return;
  snap(); rundown[i-1].dur=Math.max(5,rundown[i-1].dur-Math.round(cut));
  rundown[i-1].trimmed=true; rundownDirty=true; render(); toast("앞 항목을 "+ms(cut)+" 잘랐습니다"); }
function setTiming(id,t){ const it=rundown.find(x=>x.id===id); if(!it) return;
  snap(); it.timing=t;
  if(t!=="none"&&it.fixedAt==null) it.fixedAt=Math.round(schedule().find(r=>r.it.id===id).start/60)*60;
  rundownDirty=true; render(); flash(); }
function regen(){
  if(rundownDirty && !confirm("손으로 수정한 내용이 사라집니다. 블록 설정대로 다시 생성할까요?")) return;
  snap(); rundown=null; selItem=null; render(); toast("블록 설정대로 다시 생성했습니다");
}
function undo(){ if(!undoStack.length) return toast("되돌릴 작업이 없습니다");
  const s=JSON.parse(undoStack.pop());
  blocks=s.blocks; auto=s.auto; rundown=s.rundown; rundownDirty=s.rundownDirty;
  if(s.channels) channels=s.channels;
  render(); toast("되돌렸습니다"); }

/* ══ 리본 ═══════════════════════════════════════ */
const cv=$("ribbon"), ctx=cv.getContext("2d");
function drawRibbon(){
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(!w) return;
  cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const X=t=>t/86400*w;
  ctx.fillStyle="#0B0E10"; ctx.fillRect(0,0,w,h);
  ctx.font='10px "IBM Plex Mono",monospace'; ctx.textBaseline="top";
  for(let t=0;t<=86400;t+=3600){ const x=X(t), major=(t/3600)%3===0;
    ctx.fillStyle=major?"#2B353C":"#1C2429"; ctx.fillRect(Math.round(x),0,1,major?h:6);
    if(major){ ctx.fillStyle="#55636B";
      ctx.fillText(String(t/3600%24).padStart(2,"0"),Math.round(x)+4,h-13); } }

  $("ribLbl").textContent = view==="rundown"
    ? DOW[selDay]+"요일 · 생성된 런다운" : DOW[TODAY]+"요일 · 오늘의 편성 미리보기";

  if(view!=="rundown"){
    daySlots(TODAY).forEach(s=>{ const c=POOLS[s.b.pool].color;
      ctx.fillStyle=c+"AA"; ctx.fillRect(X(s.a),8,Math.max(1.5,X(s.z)-X(s.a)),16); });
    if(auto.on) gapsOf(TODAY).forEach(([a,z])=>{ ctx.fillStyle="#3A4750";
      ctx.fillRect(X(a),8,Math.max(1.5,X(z)-X(a)),16); });
  } else {
    schedule().forEach(r=>{
      if(r.gap>0.5){ ctx.fillStyle="rgba(255,194,74,.22)";
        ctx.fillRect(X(r.start-r.gap),8,Math.max(1.5,X(r.start)-X(r.start-r.gap)),16); }
      const onair=selDay===TODAY&&r.start<=NOW&&NOW<r.end;
      ctx.fillStyle = onair?"#FF4438" : r.it.filler?"#3D4A55"
        : r.it.timing!=="none"?"#7FD0E0"
        : (selDay===TODAY&&r.end<=NOW)?"#33424A":"#2B6B79";
      const x0=X(r.start), bw=Math.max(1.2,X(r.end)-x0);
      ctx.fillRect(x0,8,bw,16);
      if(r.it.id===selItem){ ctx.strokeStyle="#4FB3C9"; ctx.lineWidth=1;
        ctx.strokeRect(x0-.5,7.5,bw+1,17); }
    });
  }
  if(view!=="rundown"||selDay===TODAY){
    const nx=X(NOW); ctx.fillStyle="#FF4438"; ctx.fillRect(nx-.5,0,1.5,h-2);
    ctx.beginPath(); ctx.moveTo(nx-4,0); ctx.lineTo(nx+4,0); ctx.lineTo(nx,5); ctx.fill();
  }
}
cv.addEventListener("click",e=>{
  const rect=cv.getBoundingClientRect();
  const t=(e.clientX-rect.left)/rect.width*86400;
  if(view!=="rundown"){
    const s=daySlots(TODAY).find(x=>x.a<=t&&t<x.z);
    if(s){ selBlock=s.b.id; render(); } return;
  }
  const hit=schedule().find(r=>r.start<=t&&t<r.end); if(!hit) return;
  selItem=hit.it.id; render();
  document.querySelector('[data-id="'+hit.it.id+'"]')?.scrollIntoView({block:"center",behavior:"smooth"});
});
window.addEventListener("resize",drawRibbon);

  {n:"필러 삽입",s:"F",f:()=>insertFiller()},
  {n:"선택 항목 삭제",s:"Del",f:()=>delSel()},
  {n:"Hard 마커 지정",s:"",f:()=>selItem&&setTiming(selItem,"hard")},
  {n:"Soft 마커 지정",s:"",f:()=>selItem&&setTiming(selItem,"soft")},
  {n:"마커 해제",s:"",f:()=>selItem&&setTiming(selItem,"none")}
];
let palIdx=0, palHits=CMDS;
function openPal(){ $("paletteWrap").hidden=false; $("palInput").value="";
  palHits=CMDS; palIdx=0; drawPal(); $("palInput").focus(); }
const closePal=()=>$("paletteWrap").hidden=true;
function drawPal(){
  $("palList").innerHTML=palHits.map((c,i)=>'<li aria-selected="'+(i===palIdx)+'">'+esc(c.n)+
    (c.s?'<span class="sc">'+c.s+"</span>":"")+"</li>").join("");
  [...$("palList").children].forEach((li,i)=>{
    li.onmouseenter=()=>{palIdx=i;drawPal();};
    li.onclick=()=>{closePal();palHits[i].f();}; });
}
$("palInput").addEventListener("input",e=>{ const q=e.target.value.trim().toLowerCase();
  palHits=CMDS.filter(c=>!q||c.n.toLowerCase().includes(q)); palIdx=0; drawPal(); });
$("paletteWrap").addEventListener("click",e=>{ if(e.target.id==="paletteWrap") closePal(); });

function insertFiller(){ if(view!=="rundown") return toast("런다운에서 사용하세요");
  const i=rundown.findIndex(x=>x.id===selItem); snap();
  const n=mkItem({title:"브리지 루프",dur:180,src:"local",filler:true},null);
  rundown.splice(i<0?rundown.length:i+1,0,n); selItem=n.id; rundownDirty=true; render(); toast("필러 삽입"); }
function delSel(){
  if(view==="output"){ if(!selOut) return toast("선택된 출력이 없습니다");
    return delOutput(selOut); }
  if(view==="grid"){ const bl=blocks.find(b=>b.id===selBlock); if(!bl) return;
    snap(); blocks=blocks.filter(b=>b.id!==bl.id); selBlock=null; rundown=null; render();
    return toast("블록 삭제 — ⌘Z로 되돌리기"); }
  const i=rundown.findIndex(x=>x.id===selItem); if(i<0) return toast("선택된 항목이 없습니다");
  snap(); const t=rundown[i].title; rundown.splice(i,1); selItem=null; rundownDirty=true;
  render(); toast(t+" 삭제 — ⌘Z로 되돌리기"); }

document.addEventListener("keydown",e=>{
  const inField=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); return openPal(); }
  if(!$("paletteWrap").hidden){
    if(e.key==="Escape") return closePal();
    if(e.key==="ArrowDown"){e.preventDefault();palIdx=Math.min(palIdx+1,palHits.length-1);drawPal();}
    if(e.key==="ArrowUp"){e.preventDefault();palIdx=Math.max(palIdx-1,0);drawPal();}
    if(e.key==="Enter"&&palHits[palIdx]){closePal();palHits[palIdx].f();}
    return; }
  if(inField) return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); return undo(); }
  if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); return delSel(); }
  if(e.key.toLowerCase()==="f"){ e.preventDefault(); return insertFiller(); }
});

/* ══ 시계 · 토스트 ══════════════════════════════ */
let tT;
function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false;
  clearTimeout(tT); tT=setTimeout(()=>t.hidden=true,2400); }
setInterval(()=>{
  NOW+=1; $("clock").innerHTML=hms(NOW)+"<small>KST</small>";
  if(view==="rundown"&&selDay===TODAY&&rundown){
    const oa=schedule().find(r=>r.start<=NOW&&NOW<r.end);
    if(oa){ $("oaRem").textContent="−"+ms(oa.end-NOW);
      $("oaFill").style.width=((NOW-oa.start)/oa.it.dur*100).toFixed(1)+"%"; }
  }
  const nl=document.querySelector(".nowline"); if(nl) nl.style.top=(NOW/3600*26)+"px";
  drawRibbon();
},1000);

render();
})();
</script>
