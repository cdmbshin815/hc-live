<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Player — 무결절 검증</title>
<style>
:root{
  --bg:#0E1113;--panel:#14181B;--panel2:#191F23;--raised:#212A31;
  --line:#29333A;--soft:#1E262C;--text:#E6EBED;--dim:#93A1A8;--faint:#64737B;
  --accent:#4FB3C9;--accent-dim:#2B6B79;--ghost:rgba(79,179,201,.13);
  --ok:#5BC98C;--warn:#FFC24A;--err:#FF6B5A;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-size:15px;font-weight:600;margin:0}
h2{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px}

header{display:flex;align-items:center;gap:14px;padding:0 16px;height:50px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .sp{margin-left:auto}
.btn{padding:5px 11px;border:1px solid var(--line);border-radius:5px;font-size:12px;
  color:var(--dim);background:var(--panel2)}
.btn:hover{border-color:var(--accent-dim);color:var(--text)}
.btn.pri{background:var(--ghost);border-color:var(--accent-dim);color:var(--accent)}
.tag{font-size:11px;color:var(--faint)}

main{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:1px;background:var(--line);
  min-height:calc(100vh - 50px)}
section{background:var(--bg);padding:14px 16px 30px;min-width:0}

.row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:5px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.row .d{font-family:var(--mono);font-size:11px;color:var(--dim)}
.row .x{color:var(--faint);font-size:14px;line-height:1}
.row .x:hover{color:var(--err)}
.row .n{font-family:var(--mono);font-size:11px;color:var(--faint);width:20px;text-align:right}
.err{color:var(--err);font-size:11px}
.empty{color:var(--faint);padding:16px 4px;font-size:12px}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:5px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid var(--soft);font-family:var(--mono);
  font-variant-numeric:tabular-nums}
td.name{font-family:inherit;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.bad td{color:var(--warn)}
.pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px}
.pill.ok{background:rgba(91,201,140,.14);color:var(--ok)}
.pill.bad{background:rgba(255,194,74,.14);color:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--soft);border-radius:6px;padding:9px 10px}
.stat .k{font-size:10px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.stat .v{font-family:var(--mono);font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.good .v{color:var(--ok)} .stat.bad .v{color:var(--warn)}
.note{font-size:11px;color:var(--faint);line-height:1.6;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <h1>Live Player</h1>
  <span class="tag">1단계 · A/B 무결절 엔진 검증</span>
  <span class="sp"></span>
  <span class="tag" id="conn">연결 중…</span>
  <button class="btn" id="scan">라이브러리 스캔</button>
  <button class="btn pri" id="open">출력창 열기</button>
</header>

<div id="elBar" hidden style="display:flex;align-items:center;gap:10px;padding:8px 16px;
  background:var(--panel);border-bottom:1px solid var(--line)">
  <span class="tag">출력 모니터</span>
  <select id="display" style="padding:4px 7px;background:var(--bg);border:1px solid var(--line);
    border-radius:5px;color:var(--text);font:inherit;font-size:12px"></select>
  <span class="tag" id="elInfo"></span>
</div>

<main>
  <section>
    <h2>라이브러리</h2>
    <div id="lib"></div>
    <p class="note">클릭하면 런다운에 추가됩니다. <code>media/</code> 아래의 영상을 스캔합니다.</p>
  </section>

  <section>
    <h2>런다운 <span id="rdMeta" class="tag"></span></h2>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button class="btn" id="addAll">전체 추가</button>
      <button class="btn" id="clear">비우기</button>
      <button class="btn pri" id="save">출력창에 적용</button>
    </div>
    <div id="rd"></div>
  </section>

  <section>
    <h2>전환 계측</h2>
    <div class="stats">
      <div class="stat"><div class="k">전환</div><div class="v" id="sCount">0</div></div>
      <div class="stat" id="sSusBox"><div class="k">의심</div><div class="v" id="sSus">0</div></div>
      <div class="stat"><div class="k">평균 간극</div><div class="v" id="sAvg">—</div></div>
      <div class="stat"><div class="k">최대 간극</div><div class="v" id="sMax">—</div></div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button class="btn" id="resetSeams">계측 초기화</button>
    </div>
    <table>
      <thead><tr><th>시각</th><th>전환</th><th>간극</th><th>사유</th><th>판정</th></tr></thead>
      <tbody id="seams"></tbody>
    </table>
    <p class="note">
      <b>간극</b>은 이전 항목의 종료 판정 시점부터 다음 항목의 첫 프레임이 실제로 화면에 표시될 때까지의
      시간입니다. 60fps 기준 2프레임(34ms)을 넘으면 의심으로 표시합니다.
      <br>목표는 <b>의심 0건</b>입니다.
      <br><span id="sNote" style="color:var(--warn)"></span>
    </p>
  </section>
</main>

<script type="module" src="./admin.js"></script>
</body>
</html>
