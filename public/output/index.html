<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HC LIVE — 출력</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;cursor:none}
  #stage{position:fixed;inset:0;background:#000}

  /* 대기 화면 — 편성이 없거나 복구 중. 검은 화면은 어떤 경우에도 내보내지 않는다(§3.9). */
  #standby{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;transition:opacity .5s;z-index:5}
  #standby.hide{opacity:0;pointer-events:none}
  #logo{width:18%;max-width:340px;opacity:.9}

  /* 송출 시작 버튼 — 브라우저 자동재생 정책상 최초 1회 사용자 제스처가 필요하다. */
  #gate{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:#07090A;z-index:20;cursor:pointer}
  #gate h1{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em}
  #gate p{margin:0;font-size:12.5px;color:#6B7A82}
  #gate button{padding:11px 26px;border:1px solid #2B6B79;background:rgba(79,179,201,.14);
    color:#4FB3C9;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
  #gate button:hover{background:rgba(79,179,201,.22)}
  #gate.gone{display:none}

  /* 디버그 오버레이 — D 키로 토글. 실제 송출에서는 꺼둔다. */
  #dbg{position:fixed;left:0;top:0;padding:10px 14px;background:rgba(7,9,10,.82);
    font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6;
    border-bottom-right-radius:6px;z-index:10;white-space:pre;color:#B9C6CC}
  #dbg[hidden]{display:none}
  #dbg b{color:#4FB3C9;font-weight:500}
  #dbg .warn{color:#FFC24A}
</style>
</head>
<body>
  <div id="stage">
    <div id="standby">
      <svg id="logo" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg" aria-label="HC LIVE">
        <rect x="1" y="1" width="238" height="78" rx="10" fill="none" stroke="#2B3A42" stroke-width="1.5"/>
        <polygon points="30,26 30,54 54,40" fill="#4FB3C9"/>
        <text x="70" y="37" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#C9D4D9">LIVE PLAYER</text>
        <text x="70" y="58" font-family="ui-monospace,monospace" font-size="12" fill="#5C6B73">편성 대기 중</text>
      </svg>
    </div>
  </div>

  <div id="gate">
    <h1>출력창</h1>
    <p>브라우저 정책상 소리를 내려면 한 번 눌러야 합니다.</p>
    <button id="startBtn">▶ 송출 시작</button>
    <p><kbd>D</kbd> 디버그 오버레이 · <kbd>F</kbd> 전체화면</p>
  </div>

  <div id="dbg" hidden></div>

  <script type="module" src="./output.js"></script>
</body>
</html>
